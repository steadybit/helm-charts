{{- $serviceType := coalesce .Values.platform.service.type .Values.service.type -}}
{{- $tagLoadBalancer := and (eq (include "steadybit-platform.awsPartnerTagEnabled" .) "true") (eq (toString $serviceType) "LoadBalancer") -}}
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "steadybit-platform.fullname" . }}
  labels:
    {{- include "steadybit-platform.commonLabels" . | nindent 4 }}
  {{- range $key, $value := .Values.platform.extraLabels }}
    {{ $key }}: {{ $value }}
  {{- end }}
  {{- with include "steadybit-platform.annotationsWithAwsPartnerTag" (dict "annotations" .Values.service.annotations "key" "service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags" "enabled" $tagLoadBalancer) }}
  annotations:
  {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $serviceType }}
  ports:
    {{- if .Values.platform.portSplit.enabled }}
    - port: 8081
      name: egress-port
      protocol: TCP
      targetPort: 8081
    - port: 8082
      name: ingress-port
      protocol: TCP
      targetPort: 8082
    {{- else }}
    - port: 80
      name: ui-port
      protocol: TCP
      targetPort: 8080
    - port: 7878
      name: websocket-port
      protocol: TCP
      targetPort: 7878
    {{- end }}
  selector:
    {{- include "steadybit-platform.selectorLabels" . | nindent 4 }}