{{- if eq (include "steadybit-platform.ingressEnabled" .) "true" -}}
  {{- $fullName := include "steadybit-platform.fullname" . -}}
  {{- $uiPort := .Values.platform.uiPort -}}
  {{- $websocketPort := .Values.platform.websocketPort -}}
  {{- include "validNoIngressWhenPortSplitting" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "steadybit-platform.commonLabels" . | nindent 4 }}
  {{- range $key, $value := .Values.platform.extraLabels }}
    {{ $key }}: {{ $value }}
  {{- end }}
  {{- /* A load balancer shared through an IngressGroup also serves other workloads, so it is not tagged. */}}
  {{- $tagLoadBalancer := and (eq (include "steadybit-platform.awsPartnerTagEnabled" .) "true") (not (hasKey (.Values.ingress.annotations | default dict) "alb.ingress.kubernetes.io/group.name")) }}
  {{- with include "steadybit-platform.annotationsWithAwsPartnerTag" (dict "annotations" .Values.ingress.annotations "key" "alb.ingress.kubernetes.io/tags" "enabled" $tagLoadBalancer) }}
  annotations:
  {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hosts }}
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - pathType: Prefix
            path: /ws
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $websocketPort }}
          - pathType: Prefix
            path: /
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $uiPort }}
    {{- end }}
    {{- else }}
    - http:
        paths:
          - pathType: Prefix
            path: /ws
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $websocketPort }}
          - pathType: Prefix
            path: /
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $uiPort }}
  {{- end }}
{{- end }}
