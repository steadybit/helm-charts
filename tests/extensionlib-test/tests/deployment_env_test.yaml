suite: extensionlib.deployment.env
templates:
  - deployment.yaml
chart:
  appVersion: 0.0.0
  version: 0.0.0
tests:
  - it: renders defaults without any TLS or discovery.group
    asserts:
      - matchSnapshot: {}

  - it: discovery section present but no group set — no GROUP env var
    set:
      discovery:
        attributes:
          excludes: []
    asserts:
      - matchSnapshot: {}
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_DISCOVERY_GROUP

  - it: discovery.group set — STEADYBIT_EXTENSION_DISCOVERY_GROUP is added
    set:
      discovery:
        group: prod-eu
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_DISCOVERY_GROUP
            value: prod-eu

  - it: global.discovery.group set — inherited by the extension
    set:
      global:
        discovery:
          group: global-group
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_DISCOVERY_GROUP
            value: global-group

  - it: local discovery.group takes precedence over global.discovery.group
    set:
      global:
        discovery:
          group: global-group
      discovery:
        group: local-group
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_DISCOVERY_GROUP
            value: local-group

  - it: discovery.excludeQuery set — STEADYBIT_EXTENSION_DISCOVERY_EXCLUDE_QUERY is added
    set:
      discovery:
        excludeQuery: k8s.namespace IN (kube-system, istio-system)
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_DISCOVERY_EXCLUDE_QUERY
            value: k8s.namespace IN (kube-system, istio-system)
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_DISCOVERY_INCLUDE_QUERY

  - it: discovery.includeQuery set — STEADYBIT_EXTENSION_DISCOVERY_INCLUDE_QUERY is added
    set:
      discovery:
        includeQuery: k8s.namespace~"prod"
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_DISCOVERY_INCLUDE_QUERY
            value: k8s.namespace~"prod"

  - it: group and both queries combine
    set:
      discovery:
        group: prod-eu
        excludeQuery: k8s.label.tier="canary"
        includeQuery: k8s.namespace~"prod"
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_DISCOVERY_GROUP
            value: prod-eu
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_DISCOVERY_EXCLUDE_QUERY
            value: k8s.label.tier="canary"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_DISCOVERY_INCLUDE_QUERY
            value: k8s.namespace~"prod"

  - it: server TLS from secret
    set:
      tls:
        server:
          certificate:
            fromSecret: server-tls
      discovery:
        group: g1
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_TLS_SERVER_CERT
            value: /etc/extension/certificates/server-tls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_TLS_SERVER_KEY
            value: /etc/extension/certificates/server-tls/tls.key

  - it: server TLS from path
    set:
      tls:
        server:
          certificate:
            path: /etc/ext/tls.crt
            key:
              path: /etc/ext/tls.key
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_TLS_SERVER_CERT
            value: /etc/ext/tls.crt

  - it: client TLS CAs from secrets
    set:
      tls:
        client:
          certificates:
            fromSecrets:
              - ca-one
              - ca-two
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_TLS_CLIENT_CAS
            value: /etc/extension/certificates/ca-one/tls.crt,/etc/extension/certificates/ca-two/tls.crt

  - it: client TLS CAs from paths
    set:
      tls:
        client:
          certificates:
            paths:
              - /etc/ca-one.crt
              - /etc/ca-two.crt
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_EXTENSION_TLS_CLIENT_CAS
            value: /etc/ca-one.crt,/etc/ca-two.crt

  - it: custom log level and format
    set:
      logging:
        level: debug
        format: json
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_LOG_LEVEL
            value: debug
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STEADYBIT_LOG_FORMAT
            value: json

  - it: emits nothing for OpenTelemetry when no endpoint is configured
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
          any: true

  - it: renders the OpenTelemetry endpoint and defaults the service name
    set:
      otel:
        endpoint: "http://collector:4318"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://collector:4318"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: "RELEASE-NAME-extensionlib-test"

  - it: an explicit service name wins over the default
    set:
      otel:
        endpoint: "http://collector:4318"
        serviceName: "my-extension"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: "my-extension"

  - it: a global endpoint applies without per-chart configuration
    set:
      global:
        otel:
          endpoint: "http://shared-collector:4317"
          protocol: "grpc"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://shared-collector:4317"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "grpc"

  - it: a chart-level endpoint overrides the global one
    set:
      global:
        otel:
          endpoint: "http://shared-collector:4318"
      otel:
        endpoint: "http://dedicated-collector:4318"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://dedicated-collector:4318"

  - it: the traces-specific endpoint alone is enough to configure tracing
    set:
      otel:
        tracesEndpoint: "http://collector:4318/v1/traces"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: "http://collector:4318/v1/traces"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: "RELEASE-NAME-extensionlib-test"

  - it: disabled renders OTEL_SDK_DISABLED
    set:
      otel:
        endpoint: "http://collector:4318"
        disabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SDK_DISABLED
            value: "true"
